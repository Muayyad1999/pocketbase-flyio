services:
  pocketbase:
    build:
      context: .
    image: al-salam-pocketbase:0.40.4
    restart: unless-stopped
    environment:
      POCKETBASE_DEBUG: 'false'
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY:-}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      STUDENT_API_TOKEN: ${STUDENT_API_TOKEN:-}
      STUDENT_ACCEPTED_API_URL: ${STUDENT_ACCEPTED_API_URL:-}
      STUDENT_ENROLLED_API_URL: ${STUDENT_ENROLLED_API_URL:-}
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - pb_data:/pocketbase/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  pb_data:
