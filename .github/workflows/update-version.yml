name: Check PocketBase Release
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compare official release to tested pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(sed -n 's/^ARG VERSION=//p' Dockerfile)
          latest=$(gh api repos/pocketbase/pocketbase/releases/latest --jq '.tag_name')
          echo "Pinned PocketBase: $current. Latest official release: $latest." >> "$GITHUB_STEP_SUMMARY"
          if [ "v$current" != "$latest" ]; then
            echo 'An update is available. Update both container pins and local binary, run schema/backup restore tests, and review before deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
