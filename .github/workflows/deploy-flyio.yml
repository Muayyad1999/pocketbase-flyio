name: Deploy to Fly.io
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test-pr.yml
  deploy:
    needs: verify
    if: github.repository_owner == 'Muayyad1999'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Validate and deploy single database machine
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'FLY_API_TOKEN is required.'; exit 1; }
          flyctl config validate
          flyctl deploy --remote-only --ha=false
          flyctl status
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 https://al-salam-sys.fly.dev/api/health
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 https://al-salam-sys.fly.dev/api/accounting/status | python3 -c 'import json,sys; assert json.load(sys.stdin).get("schema_version", 0) >= 3, "Accounting schema 3 is required"'
