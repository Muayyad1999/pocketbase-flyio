name: Consistent Database Backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketbase-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository_owner == 'Muayyad1999'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create and verify server snapshot
        env:
          POCKETBASE_URL: ${{ vars.POCKETBASE_URL || 'https://al-salam-sys.fly.dev' }}
          PB_BACKUP_EMAIL: ${{ secrets.PB_BACKUP_EMAIL }}
          PB_BACKUP_PASSWORD: ${{ secrets.PB_BACKUP_PASSWORD }}
        run: python3 scripts/backup.py
