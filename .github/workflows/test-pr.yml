name: Container CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: pocketbase:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check scripts and CLI entrypoint
        run: |
          shellcheck scripts/entrypoint.sh
          docker run --rm pocketbase:test --version
          docker run --rm pocketbase:test superuser --help
      - name: Verify migration, startup and API
        run: |
          docker run -d --name pocketbase-smoke -p 127.0.0.1:18090:8090 pocketbase:test
          curl --fail --retry 12 --retry-all-errors --retry-delay 3 --max-time 10 http://127.0.0.1:18090/api/health
          curl --fail --silent http://127.0.0.1:18090/api/accounting/status | python3 -c 'import json,sys; assert json.load(sys.stdin).get("schema_version", 0) >= 3'
          curl --fail --silent http://127.0.0.1:18090/api/collections/employees/records | python3 -c 'import sys,json; assert json.load(sys.stdin)["items"] == []'
      - name: Container diagnostics
        if: failure()
        run: docker logs pocketbase-smoke
      - name: Cleanup ephemeral container
        if: always()
        run: docker rm -f pocketbase-smoke || true
