name: Publish Tested PocketBase Image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/test-pr.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Determine pinned image version
        id: version
        run: |
          version=$(sed -n 's/^ARG VERSION=//p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            muayyad1999/al-salam-pocketbase:${{ steps.version.outputs.value }}
            muayyad1999/al-salam-pocketbase:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
