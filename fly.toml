app = "al-salam-sys"
primary_region = "ams"
[deploy]
  strategy = "immediate"
[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"
[[mounts]]
  source = "pb_data"
  destination = "/pocketbase/data"
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
